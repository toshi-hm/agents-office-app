[package]
name = "agents-office-app"
version = "0.1.0"
description = "Agents Office — macOS Virtual Office for AI Agents (Tauri v2 + Bun)"
authors = ["toshi-hm"]
edition = "2021"

[lib]
name = "agents_office_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.7.6", features = [] }

[dependencies]
tauri = { version = "^2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "^2.8.4"
tauri-plugin-notification = "^2.8.1"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
uuid = { version = "^1.29.3", features = ["v4"] }
