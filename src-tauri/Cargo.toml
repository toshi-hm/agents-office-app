[package]
name = "agents-office-app"
version = "0.1.0"
description = "Agents Office — macOS Virtual Office for AI Agents (Tauri v2 + Bun)"
authors = ["toshi-hm"]
edition = "2021"

[lib]
name = "agents_office_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
